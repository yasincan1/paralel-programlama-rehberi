<svg xmlns="http://www.w3.org/2000/svg" width="960" height="510" viewBox="0 0 960 510" role="img" aria-labelledby="title desc"><title id="title">Böl, hesapla, bekle, birleştir</title><desc id="desc">1…1000 dizisi; her eleman yalnızca bir bölümde toplanır.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8d9fb5"/></marker></defs><rect width="960" height="510" rx="18" fill="#101720"/><g font-family="Segoe UI,Arial,sans-serif"><text x="38" y="38" fill="#75c9f0" font-size="13" text-anchor="start">DERS 10 / GÖRSEL ÖZET</text><text x="38" y="76" fill="#edf1f7" font-size="27" text-anchor="start">Böl, hesapla, bekle, birleştir</text><text x="38" y="108" fill="#bac8d9" font-size="16" text-anchor="start">1…1000 dizisi; her eleman yalnızca bir bölümde toplanır.</text><rect x="330" y="137" width="300" height="70" rx="12" fill="#192331" stroke="#75c9f0" stroke-width="2"/><text x="480.0" y="169" fill="#75c9f0" font-size="20" text-anchor="middle">Dizi: 1…1000</text><path d="M380 207 L230 254" fill="none" stroke="#8d9fb5" stroke-width="2" marker-end="url(#arrow)"/><path d="M580 207 L730 254" fill="none" stroke="#8d9fb5" stroke-width="2" marker-end="url(#arrow)"/><rect x="65" y="257" width="330" height="80" rx="12" fill="#192331" stroke="#75c9f0" stroke-width="2"/><text x="230.0" y="289" fill="#75c9f0" font-size="20" text-anchor="middle">Section 1: indeks 0…499</text><text x="230.0" y="316" fill="#bac8d9" font-size="15" text-anchor="middle">s1 = 1 + … + 500 = 125250</text><rect x="565" y="257" width="330" height="80" rx="12" fill="#192331" stroke="#75c9f0" stroke-width="2"/><text x="730.0" y="289" fill="#75c9f0" font-size="20" text-anchor="middle">Section 2: indeks 500…999</text><text x="730.0" y="316" fill="#bac8d9" font-size="15" text-anchor="middle">s2 = 501 + … + 1000 = 375250</text><path d="M230 337 L380 374" fill="none" stroke="#8d9fb5" stroke-width="2" marker-end="url(#arrow)"/><path d="M730 337 L580 374" fill="none" stroke="#8d9fb5" stroke-width="2" marker-end="url(#arrow)"/><rect x="285" y="377" width="390" height="65" rx="12" fill="#192331" stroke="#8bbdad" stroke-width="2"/><text x="480.0" y="409" fill="#8bbdad" font-size="20" text-anchor="middle">İkisi de bitti → s1 + s2 = 500500</text><path d="M38 454H922" stroke="#334258"/><text x="38" y="484" fill="#d8e2ee" font-size="16" text-anchor="start">Ayrı ara toplamlar kullan; birleştirmeyi iki iş tamamlandıktan sonra yap.</text></g></svg>
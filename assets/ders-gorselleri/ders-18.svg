<svg xmlns="http://www.w3.org/2000/svg" width="960" height="510" viewBox="0 0 960 510" role="img" aria-labelledby="title desc"><title id="title">Üç konu, üç ayrı soru</title><desc id="desc">Bu tamamlayıcı parçalar aynı algoritmanın adımları değildir.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8d9fb5"/></marker></defs><rect width="960" height="510" rx="18" fill="#101720"/><g font-family="Segoe UI,Arial,sans-serif"><text x="38" y="38" fill="#75c9f0" font-size="13" text-anchor="start">DERS 18 / GÖRSEL ÖZET</text><text x="38" y="76" fill="#edf1f7" font-size="27" text-anchor="start">Üç konu, üç ayrı soru</text><text x="38" y="108" fill="#bac8d9" font-size="16" text-anchor="start">Bu tamamlayıcı parçalar aynı algoritmanın adımları değildir.</text><text x="38" y="159" fill="#75c9f0" font-size="14" text-anchor="start">BOOTSTRAP</text><rect x="38" y="181" width="284" height="105" rx="12" fill="#192331" stroke="#75c9f0" stroke-width="2"/><text x="180.0" y="213" fill="#75c9f0" font-size="20" text-anchor="middle">Yerine koyarak örnekle</text><text x="180.0" y="240" fill="#bac8d9" font-size="15" text-anchor="middle">Belirli örnek seçilmedi mi?</text><text x="338" y="159" fill="#75c9f0" font-size="14" text-anchor="start">GAUSSIAN NAIVE BAYES</text><rect x="338" y="181" width="284" height="105" rx="12" fill="#192331" stroke="#75c9f0" stroke-width="2"/><text x="480.0" y="213" fill="#75c9f0" font-size="20" text-anchor="middle">Dağılımları karşılaştır</text><text x="480.0" y="240" fill="#bac8d9" font-size="15" text-anchor="middle">Öncül + varyans da önemlidir</text><text x="638" y="159" fill="#75c9f0" font-size="14" text-anchor="start">PUMPING LEMMA</text><rect x="638" y="181" width="284" height="105" rx="12" fill="#192331" stroke="#75c9f0" stroke-width="2"/><text x="780.0" y="213" fill="#75c9f0" font-size="20" text-anchor="middle">Gerekli düzenlilik koşulu</text><text x="780.0" y="240" fill="#bac8d9" font-size="15" text-anchor="middle">Sağlamak, düzenliliği kanıtlamaz</text><text x="480" y="350" fill="#bac8d9" font-size="18" text-anchor="middle">Önce kutuları oku; sonra bağlantının ne anlattığını açıklamayı dene.</text><text x="480" y="390" fill="#8d9fb5" font-size="16" text-anchor="middle">Aşağıdaki ders metni ve test, bu görseldeki ayrımı pekiştirir.</text><path d="M38 454H922" stroke="#334258"/><text x="38" y="484" fill="#d8e2ee" font-size="16" text-anchor="start">Bootstrap n = 2: belirli örneğin hiç seçilmeme olasılığı (1 − 1/2)² = 1/4.</text></g></svg>
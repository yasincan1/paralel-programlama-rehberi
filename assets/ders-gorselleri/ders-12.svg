<svg xmlns="http://www.w3.org/2000/svg" width="960" height="510" viewBox="0 0 960 510" role="img" aria-labelledby="title desc"><title id="title">İlerleyememenin üç farklı nedeni</title><desc id="desc">Bekleme, sonuçsuz hareket ve sıra alamama durumlarını ayır.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8d9fb5"/></marker></defs><rect width="960" height="510" rx="18" fill="#101720"/><g font-family="Segoe UI,Arial,sans-serif"><text x="38" y="38" fill="#75c9f0" font-size="13" text-anchor="start">DERS 12 / GÖRSEL ÖZET</text><text x="38" y="76" fill="#edf1f7" font-size="27" text-anchor="start">İlerleyememenin üç farklı nedeni</text><text x="38" y="108" fill="#bac8d9" font-size="16" text-anchor="start">Bekleme, sonuçsuz hareket ve sıra alamama durumlarını ayır.</text><text x="38" y="159" fill="#75c9f0" font-size="14" text-anchor="start">DEADLOCK</text><rect x="38" y="181" width="284" height="105" rx="12" fill="#192331" stroke="#75c9f0" stroke-width="2"/><text x="180.0" y="213" fill="#75c9f0" font-size="20" text-anchor="middle">T1, B’yi bekler</text><text x="180.0" y="240" fill="#bac8d9" font-size="15" text-anchor="middle">T2, A’yı bekler; ikisi de kalır</text><rect x="38" y="330" width="284" height="78" rx="12" fill="#192331" stroke="#8bbdad" stroke-width="2"/><text x="180.0" y="362" fill="#8bbdad" font-size="20" text-anchor="middle">A → T1 → B → T2 → A</text><text x="338" y="159" fill="#75c9f0" font-size="14" text-anchor="start">LIVELOCK</text><rect x="338" y="181" width="284" height="105" rx="12" fill="#192331" stroke="#75c9f0" stroke-width="2"/><text x="480.0" y="213" fill="#75c9f0" font-size="20" text-anchor="middle">İkisi de yol veriyor</text><text x="480.0" y="240" fill="#bac8d9" font-size="15" text-anchor="middle">Sürekli tepki var, sonuç yok</text><rect x="338" y="330" width="284" height="78" rx="12" fill="#192331" stroke="#8bbdad" stroke-width="2"/><text x="480.0" y="362" fill="#8bbdad" font-size="20" text-anchor="middle">Hareket var, ilerleme yok</text><text x="638" y="159" fill="#75c9f0" font-size="14" text-anchor="start">STARVATION</text><rect x="638" y="181" width="284" height="105" rx="12" fill="#192331" stroke="#75c9f0" stroke-width="2"/><text x="780.0" y="213" fill="#75c9f0" font-size="20" text-anchor="middle">T1 tekrar tekrar ilerler</text><text x="780.0" y="240" fill="#bac8d9" font-size="15" text-anchor="middle">T2’ye bir türlü sıra gelmez</text><rect x="638" y="330" width="284" height="78" rx="12" fill="#192331" stroke="#8bbdad" stroke-width="2"/><text x="780.0" y="362" fill="#8bbdad" font-size="20" text-anchor="middle">Başka işler tamamlanıyor</text><path d="M38 454H922" stroke="#334258"/><text x="38" y="484" fill="#d8e2ee" font-size="16" text-anchor="start">Deadlock için karşılıklı beklemeyi; starvation için ilerleyen başka işi ara.</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="510" viewBox="0 0 960 510" role="img" aria-labelledby="title desc"><title id="title">Kimlik doğru; peki işlem yetkili mi?</title><desc id="desc">Örnek: öğrenci sisteme giriş yapıp bir kaydı değiştirmek istiyor.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8d9fb5"/></marker></defs><rect width="960" height="510" rx="18" fill="#101720"/><g font-family="Segoe UI,Arial,sans-serif"><text x="38" y="38" fill="#75c9f0" font-size="13" text-anchor="start">DERS 16 / GÖRSEL ÖZET</text><text x="38" y="76" fill="#edf1f7" font-size="27" text-anchor="start">Kimlik doğru; peki işlem yetkili mi?</text><text x="38" y="108" fill="#bac8d9" font-size="16" text-anchor="start">Örnek: öğrenci sisteme giriş yapıp bir kaydı değiştirmek istiyor.</text><text x="38" y="159" fill="#75c9f0" font-size="14" text-anchor="start">AUTHENTICATION</text><rect x="38" y="181" width="284" height="105" rx="12" fill="#192331" stroke="#75c9f0" stroke-width="2"/><text x="180.0" y="213" fill="#75c9f0" font-size="20" text-anchor="middle">Sen kimsin?</text><text x="180.0" y="240" fill="#bac8d9" font-size="15" text-anchor="middle">Öğrencinin kimliği doğrulanır</text><path d="M322 230 L338 230" fill="none" stroke="#8d9fb5" stroke-width="2" marker-end="url(#arrow)"/><text x="338" y="159" fill="#75c9f0" font-size="14" text-anchor="start">AUTHORIZATION</text><rect x="338" y="181" width="284" height="105" rx="12" fill="#192331" stroke="#75c9f0" stroke-width="2"/><text x="480.0" y="213" fill="#75c9f0" font-size="20" text-anchor="middle">Bu işlem sana açık mı?</text><text x="480.0" y="240" fill="#bac8d9" font-size="15" text-anchor="middle">Hedef kayıt ve işlem denetlenir</text><path d="M622 230 L638 230" fill="none" stroke="#8d9fb5" stroke-width="2" marker-end="url(#arrow)"/><text x="638" y="159" fill="#75c9f0" font-size="14" text-anchor="start">KARAR</text><rect x="638" y="181" width="284" height="105" rx="12" fill="#192331" stroke="#75c9f0" stroke-width="2"/><text x="780.0" y="213" fill="#75c9f0" font-size="20" text-anchor="middle">Kendi kaydı / başkasının kaydı</text><text x="780.0" y="240" fill="#bac8d9" font-size="15" text-anchor="middle">İzin durumuna göre kabul / ret</text><text x="480" y="350" fill="#bac8d9" font-size="18" text-anchor="middle">Önce kutuları oku; sonra bağlantının ne anlattığını açıklamayı dene.</text><text x="480" y="390" fill="#8d9fb5" font-size="16" text-anchor="middle">Aşağıdaki ders metni ve test, bu görseldeki ayrımı pekiştirir.</text><path d="M38 454H922" stroke="#334258"/><text x="38" y="484" fill="#d8e2ee" font-size="16" text-anchor="start">Giriş yapmış olmak, bütün kayıtlara erişim izni vermez.</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="510" viewBox="0 0 960 510" role="img" aria-labelledby="title desc"><title id="title">Many-to-one, one-to-one, many-to-many</title><desc id="desc">U = kullanıcı thread’i · K = kernel thread’i. K, CPU çekirdeği değildir.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8d9fb5"/></marker></defs><rect width="960" height="510" rx="18" fill="#101720"/><g font-family="Segoe UI,Arial,sans-serif"><text x="38" y="38" fill="#75c9f0" font-size="13" text-anchor="start">DERS 11 / GÖRSEL ÖZET</text><text x="38" y="76" fill="#edf1f7" font-size="27" text-anchor="start">Many-to-one, one-to-one, many-to-many</text><text x="38" y="108" fill="#bac8d9" font-size="16" text-anchor="start">U = kullanıcı thread’i · K = kernel thread’i. K, CPU çekirdeği değildir.</text><text x="170" y="157" fill="#75c9f0" font-size="21" text-anchor="middle">Many-to-one</text><rect x="43" y="185" width="64" height="64" rx="12" fill="#192331" stroke="#75c9f0" stroke-width="2"/><text x="75.0" y="217" fill="#75c9f0" font-size="20" text-anchor="middle">U1</text><rect x="138" y="185" width="64" height="64" rx="12" fill="#192331" stroke="#75c9f0" stroke-width="2"/><text x="170.0" y="217" fill="#75c9f0" font-size="20" text-anchor="middle">U2</text><rect x="233" y="185" width="64" height="64" rx="12" fill="#192331" stroke="#75c9f0" stroke-width="2"/><text x="265.0" y="217" fill="#75c9f0" font-size="20" text-anchor="middle">U3</text><path d="M75 250 L170 310" fill="none" stroke="#8d9fb5" stroke-width="2" marker-end="url(#arrow)"/><path d="M170 250 L170 310" fill="none" stroke="#8d9fb5" stroke-width="2" marker-end="url(#arrow)"/><path d="M265 250 L170 310" fill="none" stroke="#8d9fb5" stroke-width="2" marker-end="url(#arrow)"/><rect x="136" y="315" width="68" height="64" rx="12" fill="#192331" stroke="#8bbdad" stroke-width="2"/><text x="170.0" y="347" fill="#8bbdad" font-size="20" text-anchor="middle">K1</text><text x="170" y="414" fill="#edf1f7" font-size="20" text-anchor="middle">3 U → 1 K</text><text x="480" y="157" fill="#75c9f0" font-size="21" text-anchor="middle">One-to-one</text><rect x="353" y="185" width="64" height="64" rx="12" fill="#192331" stroke="#75c9f0" stroke-width="2"/><text x="385.0" y="217" fill="#75c9f0" font-size="20" text-anchor="middle">U1</text><rect x="448" y="185" width="64" height="64" rx="12" fill="#192331" stroke="#75c9f0" stroke-width="2"/><text x="480.0" y="217" fill="#75c9f0" font-size="20" text-anchor="middle">U2</text><rect x="543" y="185" width="64" height="64" rx="12" fill="#192331" stroke="#75c9f0" stroke-width="2"/><text x="575.0" y="217" fill="#75c9f0" font-size="20" text-anchor="middle">U3</text><path d="M385 250 L385 310" fill="none" stroke="#8d9fb5" stroke-width="2" marker-end="url(#arrow)"/><path d="M480 250 L480 310" fill="none" stroke="#8d9fb5" stroke-width="2" marker-end="url(#arrow)"/><path d="M575 250 L575 310" fill="none" stroke="#8d9fb5" stroke-width="2" marker-end="url(#arrow)"/><rect x="351" y="315" width="68" height="64" rx="12" fill="#192331" stroke="#8bbdad" stroke-width="2"/><text x="385.0" y="347" fill="#8bbdad" font-size="20" text-anchor="middle">K1</text><rect x="446" y="315" width="68" height="64" rx="12" fill="#192331" stroke="#8bbdad" stroke-width="2"/><text x="480.0" y="347" fill="#8bbdad" font-size="20" text-anchor="middle">K2</text><rect x="541" y="315" width="68" height="64" rx="12" fill="#192331" stroke="#8bbdad" stroke-width="2"/><text x="575.0" y="347" fill="#8bbdad" font-size="20" text-anchor="middle">K3</text><text x="480" y="414" fill="#edf1f7" font-size="20" text-anchor="middle">3 U → 3 K</text><text x="790" y="157" fill="#75c9f0" font-size="21" text-anchor="middle">Many-to-many</text><rect x="663" y="185" width="64" height="64" rx="12" fill="#192331" stroke="#75c9f0" stroke-width="2"/><text x="695.0" y="217" fill="#75c9f0" font-size="20" text-anchor="middle">U1</text><rect x="758" y="185" width="64" height="64" rx="12" fill="#192331" stroke="#75c9f0" stroke-width="2"/><text x="790.0" y="217" fill="#75c9f0" font-size="20" text-anchor="middle">U2</text><rect x="853" y="185" width="64" height="64" rx="12" fill="#192331" stroke="#75c9f0" stroke-width="2"/><text x="885.0" y="217" fill="#75c9f0" font-size="20" text-anchor="middle">U3</text><path d="M695 250 L738 310" fill="none" stroke="#8d9fb5" stroke-width="2" marker-end="url(#arrow)"/><path d="M695 250 L843 310" fill="none" stroke="#8d9fb5" stroke-width="2" marker-end="url(#arrow)"/><path d="M790 250 L738 310" fill="none" stroke="#8d9fb5" stroke-width="2" marker-end="url(#arrow)"/><path d="M790 250 L843 310" fill="none" stroke="#8d9fb5" stroke-width="2" marker-end="url(#arrow)"/><path d="M885 250 L738 310" fill="none" stroke="#8d9fb5" stroke-width="2" marker-end="url(#arrow)"/><path d="M885 250 L843 310" fill="none" stroke="#8d9fb5" stroke-width="2" marker-end="url(#arrow)"/><rect x="704" y="315" width="68" height="64" rx="12" fill="#192331" stroke="#8bbdad" stroke-width="2"/><text x="738.0" y="347" fill="#8bbdad" font-size="20" text-anchor="middle">K1</text><rect x="809" y="315" width="68" height="64" rx="12" fill="#192331" stroke="#8bbdad" stroke-width="2"/><text x="843.0" y="347" fill="#8bbdad" font-size="20" text-anchor="middle">K2</text><text x="790" y="414" fill="#edf1f7" font-size="20" text-anchor="middle">3 U → 2 K</text><path d="M38 454H922" stroke="#334258"/><text x="38" y="484" fill="#d8e2ee" font-size="16" text-anchor="start">Yeterli çekirdek varsa bu örneklerde aynı anda en fazla: 1 / 3 / 2 iş.</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="510" viewBox="0 0 960 510" role="img" aria-labelledby="title desc"><title id="title">Beş durum, altı geçiş</title><desc id="desc">Ready CPU bekler; Blocked bir olayın tamamlanmasını bekler.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8d9fb5"/></marker></defs><rect width="960" height="510" rx="18" fill="#101720"/><g font-family="Segoe UI,Arial,sans-serif"><text x="38" y="38" fill="#75c9f0" font-size="13" text-anchor="start">DERS 03 / GÖRSEL ÖZET</text><text x="38" y="76" fill="#edf1f7" font-size="27" text-anchor="start">Beş durum, altı geçiş</text><text x="38" y="108" fill="#bac8d9" font-size="16" text-anchor="start">Ready CPU bekler; Blocked bir olayın tamamlanmasını bekler.</text><rect x="38" y="200" width="150" height="70" rx="12" fill="#192331" stroke="#75c9f0" stroke-width="2"/><text x="113.0" y="232" fill="#75c9f0" font-size="20" text-anchor="middle">New</text><rect x="300" y="200" width="150" height="70" rx="12" fill="#192331" stroke="#75c9f0" stroke-width="2"/><text x="375.0" y="232" fill="#75c9f0" font-size="20" text-anchor="middle">Ready</text><rect x="600" y="200" width="150" height="70" rx="12" fill="#192331" stroke="#75c9f0" stroke-width="2"/><text x="675.0" y="232" fill="#75c9f0" font-size="20" text-anchor="middle">Running</text><rect x="600" y="354" width="150" height="70" rx="12" fill="#192331" stroke="#75c9f0" stroke-width="2"/><text x="675.0" y="386" fill="#75c9f0" font-size="20" text-anchor="middle">Blocked</text><rect x="806" y="354" width="150" height="70" rx="12" fill="#192331" stroke="#75c9f0" stroke-width="2"/><text x="881.0" y="386" fill="#75c9f0" font-size="20" text-anchor="middle">Exit</text><path d="M188 235 L300 235" fill="none" stroke="#8d9fb5" stroke-width="2" marker-end="url(#arrow)"/><text x="244.0" y="226.0" fill="#c8d3e0" font-size="14" text-anchor="middle">Admit</text><path d="M450 220 L600 220" fill="none" stroke="#8d9fb5" stroke-width="2" marker-end="url(#arrow)"/><text x="525.0" y="211.0" fill="#c8d3e0" font-size="14" text-anchor="middle">Dispatch</text><path d="M650 200V154H375V200" fill="none" stroke="#8d9fb5" stroke-width="2" marker-end="url(#arrow)"/><text x="510" y="147" fill="#bac8d9" font-size="15" text-anchor="middle">Time-out</text><path d="M675 270 L675 354" fill="none" stroke="#8d9fb5" stroke-width="2" marker-end="url(#arrow)"/><text x="675.0" y="303.0" fill="#c8d3e0" font-size="14" text-anchor="middle">Event wait</text><path d="M600 389H375V270" fill="none" stroke="#8d9fb5" stroke-width="2" marker-end="url(#arrow)"/><text x="469" y="378" fill="#bac8d9" font-size="15" text-anchor="middle">Event occurs</text><path d="M750 235H881V354" fill="none" stroke="#8d9fb5" stroke-width="2" marker-end="url(#arrow)"/><text x="838" y="225" fill="#bac8d9" font-size="15" text-anchor="middle">Release</text><path d="M38 454H922" stroke="#334258"/><text x="38" y="484" fill="#d8e2ee" font-size="16" text-anchor="start">I/O bitti: Blocked → Ready. CPU verildi: Ready → Running.</text></g></svg>